name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . --quiet
      - run: python -m pytest tests/test_product_distribution.py tests/test_product_ux.py tests/test_product_hardening.py -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install build --quiet
      - run: python -m build
      - run: Get-FileHash dist/* -Algorithm SHA256 | Tee-Object SHA256SUMS
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: cat SHA256SUMS
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            SHA256SUMS
          generate_release_notes: true
