[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazograph"
version = "0.4.0"
description = "Local-first personal knowledge graph built from private life data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mempalace>=3.1.0",
]

[project.scripts]
lazo = "lazograph.cli:main"

[tool.setuptools]
packages = [
  "adapters",
  "scripts",
  "lazograph",
  "lazograph.features",
  "lazograph.features.import_chat",
]

[tool.setuptools.package-dir]
lazograph = "src/lazograph"
adapters = "adapters"
scripts = "scripts"
