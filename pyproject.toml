[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazograph"
version = "0.8.0"
description = "Local-first personal knowledge graph built from private life data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mempalace>=3.3.6",
  "tzdata>=2025.2",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
lazo = "lazograph.cli:main"

[tool.setuptools]
packages = [
  "adapters",
  "scripts",
  "lazograph",
  "lazograph.features",
  "lazograph.features.import_chat",
  "lazograph.features.ask_person",
  "lazograph.features.ask_relationship",
  "lazograph.features.add_context",
  "lazograph.features.correct_knowledge",
  "lazograph.features.pending_plans",
  "lazograph.features.suggestions",
  "lazograph.domain",
  "lazograph.ports",
  "lazograph.infrastructure",
  "lazograph.infrastructure.llm",
  "lazograph.ui",
]

[tool.setuptools.package-dir]
lazograph = "src/lazograph"
adapters = "adapters"
scripts = "scripts"
